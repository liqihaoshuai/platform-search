[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "platform-search-skill"
version = "2.0.2"
description = "Standalone cross-platform public search engine"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "platform-search contributors" }]
dependencies = []

[tool.platform-search]
python-baseline = "3.11+"
config-directory = "~/.config/platform-search"
output-directory = "~/Documents/platform-search"

[tool.setuptools]
py-modules = ["scripts.platform_search", "scripts.web_engines"]
